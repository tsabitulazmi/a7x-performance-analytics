services:

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"

    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/a7x_performance_analytics/src
      - ./catalog:/opt/airflow/a7x_performance_analytics/catalog
      - ./data:/opt/airflow/a7x_performance_analytics/data
      - ./dbt:/opt/airflow/a7x_performance_analytics/dbt
      - ./.env:/opt/airflow/a7x_performance_analytics/.env

    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AWS_DEFAULT_REGION: ${AWS_REGION}

    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/a7x_performance_analytics/src
      - ./catalog:/opt/airflow/a7x_performance_analytics/catalog
      - ./data:/opt/airflow/a7x_performance_analytics/data
      - ./dbt:/opt/airflow/a7x_performance_analytics/dbt
      - ./.env:/opt/airflow/a7x_performance_analytics/.env

    ports:
      - "8080:8080"

    command: webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AWS_DEFAULT_REGION: ${AWS_REGION}

    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/a7x_performance_analytics/src
      - ./catalog:/opt/airflow/a7x_performance_analytics/catalog
      - ./data:/opt/airflow/a7x_performance_analytics/data
      - ./dbt:/opt/airflow/a7x_performance_analytics/dbt
      - ./.env:/opt/airflow/a7x_performance_analytics/.env
      - ${USERPROFILE}/.aws:/home/airflow/.aws:ro

    command: scheduler

volumes:
  postgres-db-volume: